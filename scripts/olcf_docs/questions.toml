# The retrieval gate for the `olcf-docs` corpus (check_retrieval.py, design.md Decision 8).
#
# Each question names a file-name prefix that must appear among the files of the top 5
# hits. Prefixes are `<page path with / as __>__` plus, where one section is the clear
# answer, that section's anchor (see convert.py for the naming). Checked against the
# conversion of olcf-user-docs at d86ce4c; when a refresh renames a page or a section,
# update the prefix here, which is the point of running the gate after each refresh.

