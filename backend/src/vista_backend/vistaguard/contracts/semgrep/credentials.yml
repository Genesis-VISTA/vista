# VISTAGuard G4 -- credential exfiltration rules.
#
# Catches reads of well-known credential files and sensitive
# environment variables. An LLM emitting any of these in the
# sandbox is a strong signal of credential-exfiltration intent,
# regardless of where the value goes from there -- the exfiltration
# step is usually a separate network-write rule (see
# `network.yml`).
#
# The credential-file list covers the high-value targets: cloud
# CLI tokens (~/.aws/credentials, ~/.azure/credentials,
# ~/.config/gcloud/...), SSH keys (~/.ssh/id_*), netrc
# (~/.netrc / ~/_netrc), GnuPG (~/.gnupg/...), and the system
# password / shadow files. Operators with additional credential
# locations should extend this list in `contracts_dir`.

rules:
  - id: vista-credential-file-read
    languages: [python]
    severity: ERROR
    message: |
      Reading a well-known credential file (SSH key, AWS/Azure/GCP
      CLI credentials, .netrc, /etc/passwd, /etc/shadow) from inside
      the sandbox is almost always part of a credential-exfiltration
      attack. The agent does not legitimately need these files;
      refuse the operation. 
    metadata:
      vista-threat-surface: credential-exfiltration
      vista-taxonomy: "4.4"
      vista-rule-version: 1
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
    pattern-either:
      - pattern: open("/etc/passwd", ...)
      - pattern: open("/etc/shadow", ...)
      - pattern: open("/etc/sudoers", ...)
      - pattern: open("~/.ssh/id_rsa", ...)
      - pattern: open("~/.ssh/id_ed25519", ...)
      - pattern: open("~/.ssh/id_ecdsa", ...)
      - pattern: open("~/.ssh/known_hosts", ...)
      - pattern: open("~/.aws/credentials", ...)
      - pattern: open("~/.azure/credentials", ...)
      - pattern: open("~/.config/gcloud/application_default_credentials.json", ...)
      - pattern: open("~/.netrc", ...)
      - pattern: open("~/_netrc", ...)
      - pattern: open("~/.gnupg/secring.gpg", ...)
      - pattern: open("~/.docker/config.json", ...)
      - pattern: open("~/.kube/config", ...)

  - id: vista-credential-env-var-read
    languages: [python]
    severity: WARNING
    message: |
      The agent is reading a sensitive credential environment
      variable. A read alone is not always malicious (some tools
      need the value to authenticate), but pair with a network /
      file write to a non-allow-listed sink and the result is
      credential exfiltration. The agent should refuse to forward
      the value to any untrusted sink. 
    metadata:
      vista-threat-surface: credential-exfiltration
      vista-taxonomy: "5.7"
      vista-rule-version: 1
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
    pattern-either:
      - pattern: os.environ["AWS_SECRET_ACCESS_KEY"]
      - pattern: os.environ["AWS_SESSION_TOKEN"]
      - pattern: os.environ.get("AWS_SECRET_ACCESS_KEY", ...)
      - pattern: os.environ.get("AWS_SESSION_TOKEN", ...)
      - pattern: os.environ["AZURE_CLIENT_SECRET"]
      - pattern: os.environ.get("AZURE_CLIENT_SECRET", ...)
      - pattern: os.environ["GOOGLE_APPLICATION_CREDENTIALS"]
      - pattern: os.environ.get("GOOGLE_APPLICATION_CREDENTIALS", ...)
      - pattern: os.environ["GITHUB_TOKEN"]
      - pattern: os.environ.get("GITHUB_TOKEN", ...)
      - pattern: os.environ["OPENAI_API_KEY"]
      - pattern: os.environ.get("OPENAI_API_KEY", ...)
      - pattern: os.environ["ANTHROPIC_API_KEY"]
      - pattern: os.environ.get("ANTHROPIC_API_KEY", ...)
      - pattern: os.environ["SLACK_TOKEN"]
      - pattern: os.environ.get("SLACK_TOKEN", ...)
      - pattern: os.environ["NERSC_IRI_TOKEN"]
      - pattern: os.environ.get("NERSC_IRI_TOKEN", ...)
      - pattern: os.environ["S3M_TOKEN"]
      - pattern: os.environ.get("S3M_TOKEN", ...)
