# VISTAGuard G4 -- dynamic-code-execution rules.
#
# Detects sandbox-escape primitives that turn an LLM-emitted string
# back into executable code. `eval`/`exec`/`compile` are the
# straightforward ones; `pickle.loads` is the famous
# unintentionally-arbitrary-code-execution path -- a serialized
# Python object can carry executable `__reduce__` payloads that
# fire on deserialization.

rules:
  - id: vista-eval-exec
    languages: [python]
    severity: ERROR
    message: |
      `eval`/`exec`/`compile` execute arbitrary code. Even when the
      input *looks* safe, an LLM emitting these in the sandbox is a
      strong signal of an attempted sandbox-escape. Prefer a
      restricted expression evaluator (e.g. `ast.literal_eval` for
      data) or refuse the operation entirely. 
    metadata:
      vista-threat-surface: code-execution
      vista-taxonomy: "4.2"
      vista-rule-version: 1
      category: security
      cwe: "CWE-95: Code Injection (eval)"
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: compile(...)

  - id: vista-pickle-untrusted
    languages: [python]
    severity: ERROR
    message: |
      `pickle.loads` / `pickle.load` deserialize attacker-controlled
      bytes into arbitrary Python objects, including executable
      `__reduce__` payloads -- this is a documented RCE pattern. If
      a tool return or RAG chunk needs to round-trip Python objects,
      use a safe format (JSON, msgpack with strict schemas) instead.
    metadata:
      vista-threat-surface: code-execution
      vista-taxonomy: "4.3"
      vista-rule-version: 1
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: cPickle.loads(...)
      - pattern: cPickle.load(...)
      - pattern: dill.loads(...)
      - pattern: dill.load(...)
