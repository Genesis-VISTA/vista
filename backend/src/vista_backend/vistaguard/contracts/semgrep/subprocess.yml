# VISTAGuard G4 -- subprocess / shell-execution rules.
#
# Catches code that invokes a shell to run another program. The
# threat surface is shell-metacharacter injection: any user- or
# RAG-derived string concatenated into a shell command string can
# break out of the intended command and run arbitrary code.
#
# Detection priority is on the *interface* (shell=True, os.system),
# not on the *content* of the command -- the content can be
# adversarial in ways the regex layer doesn't catch, while the
# interface is a small enumerable set.

rules:
  - id: vista-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: |
      `subprocess.*` invoked with `shell=True` exposes the agent to
      shell-metacharacter injection. Pass an argument list and leave
      `shell=False` (the default). See VISTAGuard G4 / attack
      taxonomy §4.1.
    metadata:
      vista-threat-surface: code-execution
      vista-taxonomy: "4.1"
      vista-rule-version: 1
      category: security
      cwe: "CWE-78: OS Command Injection"
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.check_call(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)

  - id: vista-os-system
    languages: [python]
    severity: ERROR
    message: |
      `os.system(...)` always invokes a shell and is unsafe for any
      input not vetted by VISTAGuard. Prefer
      `subprocess.run(["cmd", "arg"], shell=False)` so arguments are
      passed without shell interpretation. See VISTAGuard G4 /
      attack taxonomy §4.1.
    metadata:
      vista-threat-surface: code-execution
      vista-taxonomy: "4.1"
      vista-rule-version: 1
      category: security
      cwe: "CWE-78: OS Command Injection"
    pattern: os.system(...)

  - id: vista-os-popen
    languages: [python]
    severity: ERROR
    message: |
      `os.popen(...)` invokes a shell and pipes its stdout back. Use
      `subprocess.run(..., shell=False, capture_output=True)`
      instead. See VISTAGuard G4 / attack taxonomy §4.1.
    metadata:
      vista-threat-surface: code-execution
      vista-taxonomy: "4.1"
      vista-rule-version: 1
      category: security
      cwe: "CWE-78: OS Command Injection"
    pattern: os.popen(...)
