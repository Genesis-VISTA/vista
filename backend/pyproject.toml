[project]
name = "vista-backend"
version = "0.1.0"
requires-python = "~=3.14.3"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "pydantic-ai>=1.90.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.38",
    "sqlalchemy[asyncio]>=2.0",
    "anyio>=4.13.0",
    "aiosqlite>=0.20.0",
    "pymupdf>=1.26",
    "openai>=1.69",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0",
    "cryptography>=48.0.0",
    "pydantic-ai-shields>=0.3.2,<0.4",
    "jsonschema>=4.21,<5",
    "numpy>=1.26,<3",
    "anyio[trio]>=4.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
vista-backend = "vista_backend.api.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = [
  "*.md",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
