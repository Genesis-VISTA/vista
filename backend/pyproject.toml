[project]
name = "vista-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-ai",
    "pydantic-settings",
    "python-dotenv",
    "vista-mcp-server",
]

[tool.uv.sources]
vista-mcp-server = { path = "../mcp-server", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vista-backend = "backend.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
