[project]
name = "vista-backend"
version = "0.1.0"
requires-python = "~=3.14.3"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "pydantic-ai>=1.105.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.38",
    "sqlalchemy[asyncio]>=2.0",
    "anyio>=4.13.0",
    "aiosqlite>=0.20.0",
    "pymupdf>=1.26",
    "openai>=1.69",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0",
    "cryptography>=48.0.0",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    # Connecting a researcher's Globus account: the same native-app flow
    # `scripts/get_globus_token.py` runs, driven from the settings interface.
    "globus-sdk>=3.40",
    "pydantic-ai-shields>=0.3.2,<0.4",
    "jsonschema>=4.21,<5",
    "numpy>=1.26,<3",
    "anyio[trio]>=4.0",
    "aiosqlite>=0.20.0",
    "semgrep>=1.79.0",
    "flowcept>=0.10.6",
    # PALISADE security-mediation sidecar, formerly vendored in-tree as
    # `vista_backend.vistaguard`. Its companion benchmark SIEGE is a
    # separate distribution and is deliberately NOT depended on: a
    # 205-instance attack corpus has no business in a production install.
    "palisade==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
vista-backend = "vista_backend.api.api:main"

# The sidecar is fetched from its own repository at a pinned tag, not from a
# sibling checkout: CI clones only this repo, and a path source cannot
# resolve there. A tag rather than a branch because a gate stack that drifts
# underneath a deployment is a security change nobody reviewed.
#
# The repository is private until its license clears review, so resolving this
# needs credentials. A developer machine supplies them from a credential helper
# without saying so -- which is why a sync that works locally can still fail on
# a runner. CI passes a read-only token scoped to this one repository; see
# PALISADE_GITHUB_TOKEN in .gitlab-ci.yml.
[tool.uv.sources]
palisade = { git = "https://github.com/herronej/palisade_siege_agentic_security.git", tag = "v1.0.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = [
  "*.md",
]

[tool.ruff]
# Embedded skill scripts are user-facing templates, not application source
exclude = ["src/vista_backend/db/skills"]

[tool.pyright]
include = ["src"]
# Embedded skill scripts import deps (pandas, matplotlib) not in the project venv
exclude = ["src/vista_backend/db/skills"]
# Basic mode filters framework-generic false positives from SQLModel / pydantic-ai
typeCheckingMode = "basic"
pythonVersion = "3.14"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
markers = [
    "unit: pure / hermetic unit tests",
    "integration: multi-module hermetic tests (fakes OK)",
    "live: needs configured model or external live services (opt-in)",
    "sandbox: needs microsandbox / Docker daemon",
    "hpc: needs real cluster credentials",
]

[tool.uv]
python-preference = "only-managed"
