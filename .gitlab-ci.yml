# Vista CI Pipeline
#
# Stages:
#   lint     — ruff (lint + format), ESLint, TypeScript type-check, bandit security scan
#   test     — pytest (backend + vista_mcp_server + dev_mcp_server); hermetic only;
#              each job publishes a JUnit XML report for pipelines/MRs
#   nightly  — scheduled / manual validation lane (Milestone D); never blocks MRs
#
# Python jobs use the official uv image and let uv manage the Python 3.14 install.
# Node jobs use node:22-slim. All jobs run in parallel within each stage.
#
# Hermetic PR expression (required jobs): -m "not live and not hpc and not sandbox"
# Live / HPC secrets MUST exist only in scheduled pipeline variables — never as
# required variables for merge-request pipelines.

stages:
  - lint
  - test
  - nightly

default:
  interruptible: true

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_PYTHON_DOWNLOADS: "auto"
  # Pin lint/security/type-check tooling so `uvx` does not silently pull a new
  # release that changes default rule sets (e.g. ruff 0.16 broadened defaults)
  # and turns a previously-green pipeline red.
  RUFF_VERSION: "0.15.7"
  PYRIGHT_VERSION: "1.1.411"
  BANDIT_VERSION: "1.9.4"

# ─── Python image ───────────────────────────────────────────────────────────
#
# ghcr.io/astral-sh/uv:latest sets `uv` as its Docker ENTRYPOINT, which
# prevents GitLab's runner from starting `sh` to execute job scripts.
# Using the python3.14-bookworm-slim variant (Debian base with sh + Python 3.14
# bundled) and clearing the entrypoint fixes this for all Python jobs.

.python-image: &python-image
  image:
    name: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    entrypoint: [""]

# ─── Cache anchors ──────────────────────────────────────────────────────────

.cache-uv-backend: &cache-uv-backend
  cache:
    key:
      prefix: uv-backend
      files:
        - backend/uv.lock
    paths:
      - .uv-cache/
      - backend/.venv/

.cache-uv-dev-mcp: &cache-uv-dev-mcp
  cache:
    key:
      prefix: uv-dev-mcp
      files:
        - mcp_servers/dev_mcp_server/uv.lock
    paths:
      - .uv-cache/
      - mcp_servers/dev_mcp_server/.venv/

.cache-uv-vista-mcp: &cache-uv-vista-mcp
  cache:
    key:
      prefix: uv-vista-mcp
      files:
        - mcp_servers/vista_mcp_server/uv.lock
    paths:
      - .uv-cache/
      - mcp_servers/vista_mcp_server/.venv/

.cache-npm-ui: &cache-npm-ui
  cache:
    key:
      prefix: npm-ui
      files:
        - ui/package-lock.json
    paths:
      - ui/node_modules/

# ─── Backend ────────────────────────────────────────────────────────────────

backend:lint:
  stage: lint
  <<: [*python-image, *cache-uv-backend]
  script:
    - cd backend
    # ruff is run via uvx so no project install is needed for this job
    - uvx ruff@${RUFF_VERSION} check src/ tests/
    - uvx ruff@${RUFF_VERSION} format --check src/ tests/

backend:typecheck:
  stage: lint
  <<: [*python-image, *cache-uv-backend]
  before_script:
    # pyright's bundled Node.js binary requires libatomic, absent in bookworm-slim
    - apt-get update -qq && apt-get install -y --no-install-recommends libatomic1
  script:
    - cd backend
    # Install project deps so pyright can resolve imports
    - uv sync --frozen
    # --with pyright adds pyright temporarily without touching the lock file
    - uv run --with "pyright==${PYRIGHT_VERSION}" pyright src/
  # The type-check baseline is clean (zero pyright errors), so this is a
  # required gate: any new type regression fails the pipeline.

backend:security:
  stage: lint
  <<: *python-image
  script:
    - cd backend
    # bandit -ll reports only medium+ severity findings
    - uvx bandit@${BANDIT_VERSION} -r src/ -ll -q
  # Treat as advisory — findings are reported but don't block the pipeline
  allow_failure: true

backend:test:
  stage: test
  <<: [*python-image, *cache-uv-backend]
  script:
    - cd backend
    - uv sync --frozen --dev
    # Hermetic PR CI: exclude live / real-HPC / microsandbox-marked tests
    - uv run pytest tests/ -v --tb=short -m "not live and not hpc and not sandbox"
      --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: backend/junit.xml
    expire_in: 1 week

# ─── vista_mcp_server ───────────────────────────────────────────────────────

vista-mcp:lint:
  stage: lint
  <<: [*python-image, *cache-uv-vista-mcp]
  script:
    - cd mcp_servers/vista_mcp_server
    # Lint new/owned test code only; src/ has pre-existing ruff debt tracked separately
    - uvx ruff@${RUFF_VERSION} check tests/
    - uvx ruff@${RUFF_VERSION} format --check tests/

vista-mcp:test:
  stage: test
  <<: [*python-image, *cache-uv-vista-mcp]
  # Required job — must NOT set allow_failure.
  script:
    - cd mcp_servers/vista_mcp_server
    # Install without the private `hpc` extra (amscrot-py). CI job tokens cannot
    # access amsc-isro-toolkit; hermetic tests use FakeIriClient / dry-run.
    - uv sync --frozen --extra dev
    - uv run pytest tests/ -v --tb=short -m "not live and not hpc and not sandbox"
      --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: mcp_servers/vista_mcp_server/junit.xml
    expire_in: 1 week

# ─── dev_mcp_server ─────────────────────────────────────────────────────────

dev-mcp:lint:
  stage: lint
  <<: [*python-image, *cache-uv-dev-mcp]
  script:
    - cd mcp_servers/dev_mcp_server
    - uvx ruff@${RUFF_VERSION} check src/ tests/
    - uvx ruff@${RUFF_VERSION} format --check src/ tests/

dev-mcp:test:
  stage: test
  <<: [*python-image, *cache-uv-dev-mcp]
  before_script:
    # python-magic (dep of dev_mcp_server) requires the libmagic system library
    - apt-get update -qq && apt-get install -y --no-install-recommends libmagic1
  script:
    - cd mcp_servers/dev_mcp_server
    # pytest lives in [project.optional-dependencies] dev, not [dependency-groups]
    - uv sync --frozen --extra dev
    # Microsandbox/container tests are marked `sandbox` and excluded here (no
    # docker/podman on the runner); the remaining unit tests are hermetic.
    - uv run pytest tests/ -v --tb=short -m "not live and not hpc and not sandbox"
      --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: mcp_servers/dev_mcp_server/junit.xml
    expire_in: 1 week

# ─── UI ─────────────────────────────────────────────────────────────────────

ui:lint:
  stage: lint
  image: node:22-slim
  <<: *cache-npm-ui
  script:
    - cd ui
    - npm ci --prefer-offline
    - npm run lint

ui:typecheck:
  stage: lint
  image: node:22-slim
  <<: *cache-npm-ui
  script:
    - cd ui
    - npm ci --prefer-offline
    - npx tsc --noEmit

# ─── Nightly validation lane (Milestone D) ──────────────────────────────────
#
# Schedule this pipeline in GitLab (CI/CD → Schedules) and attach secrets only
# to the schedule. Point VISTA_LIVE_BASE_URL at a standing stack with dry-run
# HPC + a real model. See docs/validation-lane.md.

.nightly-rules: &nightly-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $VISTA_RUN_VALIDATION == "1"'
    - when: never

nightly:validation:
  stage: nightly
  <<: [*python-image, *cache-uv-backend, *nightly-rules]
  allow_failure: true
  variables:
    VISTA_RUN_LIVE: "1"
    # Override in schedule variables: VISTA_BACKEND_MODEL, provider keys,
    # VISTA_LIVE_BASE_URL, VISTA_RUN_FAULT_CHECKS, VISTA_RUN_PLAYWRIGHT
  script:
    - ./scripts/nightly-validation.sh

nightly:playwright:
  stage: nightly
  image: mcr.microsoft.com/playwright:v1.51.0-jammy
  <<: *cache-npm-ui
  allow_failure: true
  # Separate optional job so UI smoke can run without the Python validation
  # stack when only PLAYWRIGHT_BASE_URL is configured.
  # Intentionally NOT a required MR job (no merge_request_event rules).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $VISTA_RUN_PLAYWRIGHT == "1"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $VISTA_RUN_VALIDATION == "1" && $VISTA_RUN_PLAYWRIGHT == "1"'
    - when: never
  script:
    - cd ui
    - npm ci --prefer-offline
    - npx playwright test -c playwright.config.ts
