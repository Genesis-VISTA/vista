# Vista CI Pipeline
#
# Stages:
#   lint     — ruff (lint + format), ESLint, TypeScript type-check, bandit security scan
#   test     — pytest (backend + vista_mcp_server + dev_mcp_server); hermetic only;
#              each job publishes a JUnit XML report for pipelines/MRs
#   nightly  — scheduled / manual validation lane (Milestone D); never blocks MRs
#
# Python jobs use the official uv image and let uv manage the Python 3.14 install.
# Node jobs use node:22-slim. All jobs run in parallel within each stage.
#
# Hermetic PR expression (required jobs): -m "not live and not hpc and not sandbox"
# Live / HPC secrets MUST exist only in scheduled pipeline variables — never as
# required variables for merge-request pipelines.

stages:
  - lint
  - test
  - nightly

default:
  interruptible: true

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_PYTHON_DOWNLOADS: "auto"
  # Pin lint/security/type-check tooling so `uvx` does not silently pull a new
  # release that changes default rule sets (e.g. ruff 0.16 broadened defaults)
  # and turns a previously-green pipeline red.
  RUFF_VERSION: "0.15.7"
  PYRIGHT_VERSION: "1.1.411"
  BANDIT_VERSION: "1.9.4"
  # The PALISADE sidecar is a git dependency of the backend, living in a private
  # GitHub repository until its license clears review. Jobs that install the
  # backend read it with PALISADE_GITHUB_TOKEN, a read-only fine-grained PAT
  # scoped to that one repository, set under Settings > CI/CD > Variables.
  #
  # Mark it masked but NOT protected: this branch is unprotected, and a
  # protected variable is simply absent here -- which would look exactly like a
  # bad token. Held host-relative so the rewrite below need not repeat the URL.
  PALISADE_REPO: "github.com/herronej/palisade_siege_agentic_security.git"

# ─── Python image ───────────────────────────────────────────────────────────
#
# ghcr.io/astral-sh/uv:latest sets `uv` as its Docker ENTRYPOINT, which
# prevents GitLab's runner from starting `sh` to execute job scripts.
# Using the python3.14-bookworm-slim variant (Debian base with sh + Python 3.14
# bundled) and clearing the entrypoint fixes this for all Python jobs.

.python-image: &python-image
  image:
    name: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    entrypoint: [""]
  # Runs before the cache is saved. Drops wheels downloaded pre-built from PyPI
  # (quicker to fetch again than to zip and unzip) and keeps wheels built from
  # source, such as the PALISADE git dependency.
  after_script:
    - uv cache prune --ci

# ─── Cache anchors ──────────────────────────────────────────────────────────
#
# Only uv's cache is kept, never a project's .venv/. uv installs managed Python
# (python-preference = "only-managed") under the home directory, which is not
# cached, so a restored .venv links to an interpreter that no longer exists and
# uv discards it. Rebuilding it from .uv-cache/ takes about a second.

.cache-uv-backend: &cache-uv-backend
  cache:
    key:
      prefix: uv-backend
      files:
        - backend/uv.lock
    paths:
      - .uv-cache/

.cache-uv-dev-mcp: &cache-uv-dev-mcp
  cache:
    key:
      prefix: uv-dev-mcp
      files:
        - mcp_servers/dev_mcp_server/uv.lock
    paths:
      - .uv-cache/

.cache-uv-vista-mcp: &cache-uv-vista-mcp
  cache:
    key:
      prefix: uv-vista-mcp
      files:
        - mcp_servers/vista_mcp_server/uv.lock
    paths:
      - .uv-cache/

.cache-npm-ui: &cache-npm-ui
  cache:
    key:
      prefix: npm-ui
      files:
        - ui/package-lock.json
    paths:
      - ui/node_modules/

# ─── Backend ────────────────────────────────────────────────────────────────

backend:lint:
  stage: lint
  <<: [*python-image, *cache-uv-backend]
  script:
    - cd backend
    # ruff is run via uvx so no project install is needed for this job
    - uvx ruff@${RUFF_VERSION} check src/ tests/
    - uvx ruff@${RUFF_VERSION} format --check src/ tests/

backend:typecheck:
  stage: lint
  <<: [*python-image, *cache-uv-backend]
  before_script:
    # libatomic: pyright's bundled Node.js binary needs it, absent in bookworm-slim
    # git: uv shells out to it to fetch the PALISADE sidecar at its release tag.
    #   The runner's own clone happens in the GitLab helper image, so nothing
    #   needed git *inside* the job image until the backend gained a git source.
    - apt-get update -qq && apt-get install -y --no-install-recommends libatomic1 git
    # Fail with the actual cause: without this, a missing token surfaces as
    # `could not read Username for 'https://github.com'`, which reads like a
    # broken URL rather than an unset variable.
    - test -n "${PALISADE_GITHUB_TOKEN:-}" || { echo "PALISADE_GITHUB_TOKEN is unset -- add it under Settings > CI/CD > Variables (masked, NOT protected)"; exit 1; }
    # Read the private sidecar. Rewriting only PALISADE's own URL, not all of
    # github.com, keeps the token off every other fetch.
    - git config --global url."https://x-access-token:${PALISADE_GITHUB_TOKEN}@${PALISADE_REPO}".insteadOf "https://${PALISADE_REPO}"
  script:
    - cd backend
    # Install project deps so pyright can resolve imports
    - uv sync --frozen
    # --with pyright adds pyright temporarily without touching the lock file
    - uv run --with "pyright==${PYRIGHT_VERSION}" pyright src/
  # The type-check baseline is clean (zero pyright errors), so this is a
  # required gate: any new type regression fails the pipeline.

backend:security:
  stage: lint
  <<: *python-image
  script:
    - cd backend
    # bandit -ll reports only medium+ severity findings
    - uvx bandit@${BANDIT_VERSION} -r src/ -ll -q
  # Treat as advisory — findings are reported but don't block the pipeline
  allow_failure: true

backend:test:
  stage: test
  variables:
    # With the pytest config, fails text I/O that relies on the locale's encoding.
    PYTHONWARNDEFAULTENCODING: "1"
  <<: [*python-image, *cache-uv-backend]
  before_script:
    # uv shells out to git to fetch the PALISADE sidecar at its release tag, and
    # bookworm-slim ships no git. See backend:typecheck for the full note.
    - apt-get update -qq && apt-get install -y --no-install-recommends git
    - test -n "${PALISADE_GITHUB_TOKEN:-}" || { echo "PALISADE_GITHUB_TOKEN is unset -- add it under Settings > CI/CD > Variables (masked, NOT protected)"; exit 1; }
    - git config --global url."https://x-access-token:${PALISADE_GITHUB_TOKEN}@${PALISADE_REPO}".insteadOf "https://${PALISADE_REPO}"
  script:
    - cd backend
    - uv sync --frozen --dev
    # Hermetic PR CI: exclude live / real-HPC / microsandbox-marked tests
    - uv run pytest tests/ -v --tb=short -m "not live and not hpc and not sandbox"
      --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: backend/junit.xml
    expire_in: 1 week

# ─── vista_mcp_server ───────────────────────────────────────────────────────

vista-mcp:lint:
  stage: lint
  <<: [*python-image, *cache-uv-vista-mcp]
  script:
    - cd mcp_servers/vista_mcp_server
    # Lint new/owned test code only; src/ has pre-existing ruff debt tracked separately
    - uvx ruff@${RUFF_VERSION} check tests/
    - uvx ruff@${RUFF_VERSION} format --check tests/

vista-mcp:test:
  stage: test
  variables:
    # With the pytest config, fails text I/O that relies on the locale's encoding.
    PYTHONWARNDEFAULTENCODING: "1"
  <<: *python-image
  # Also caches dev_mcp_server's own venv, spelled out here rather than by
  # merging *cache-uv-dev-mcp too: a `<<:` merge only keeps the first `cache:`
  # key when two merged anchors each define one, so the second would be
  # silently dropped instead of adding a second cache entry. And each of
  # *cache-uv-vista-mcp's and *cache-uv-dev-mcp's own value is itself a
  # `{cache: {key, paths}}` map (one cache entry, not a list item's own
  # `key`/`paths`), so merging either directly into a list item here would
  # nest one level too deep instead of producing a `{key, paths}` entry.
  cache:
    - key:
        prefix: uv-vista-mcp
        files:
          - mcp_servers/vista_mcp_server/uv.lock
      paths:
        - .uv-cache/
  # Required job — must NOT set allow_failure.
  script:
    - cd mcp_servers/vista_mcp_server
    # Install without the private `hpc` extra (amscrot-py). CI job tokens cannot
    # access amsc-isro-toolkit; hermetic tests use FakeIriClient / dry-run.
    - uv sync --frozen --extra dev
    - uv run pytest tests/ -v --tb=short -m "not live and not hpc and not sandbox"
      --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: mcp_servers/vista_mcp_server/junit.xml
    expire_in: 1 week

# ─── dev_mcp_server ─────────────────────────────────────────────────────────

dev-mcp:lint:
  stage: lint
  <<: [*python-image, *cache-uv-dev-mcp]
  script:
    - cd mcp_servers/dev_mcp_server
    - uvx ruff@${RUFF_VERSION} check src/ tests/
    - uvx ruff@${RUFF_VERSION} format --check src/ tests/

dev-mcp:test:
  stage: test
  variables:
    # With the pytest config, fails text I/O that relies on the locale's encoding.
    PYTHONWARNDEFAULTENCODING: "1"
  <<: [*python-image, *cache-uv-dev-mcp]
  before_script:
    # python-magic (dep of dev_mcp_server) requires the libmagic system library
    - apt-get update -qq && apt-get install -y --no-install-recommends libmagic1
  script:
    - cd mcp_servers/dev_mcp_server
    # pytest lives in [project.optional-dependencies] dev, not [dependency-groups]
    - uv sync --frozen --extra dev
    # Microsandbox/container tests are marked `sandbox` and excluded here (no
    # docker/podman on the runner); the remaining unit tests are hermetic.
    - uv run pytest tests/ -v --tb=short -m "not live and not hpc and not sandbox"
      --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: mcp_servers/dev_mcp_server/junit.xml
    expire_in: 1 week

# ─── VISTA window (electron/) ───────────────────────────────────────────────
#
# Hermetic: the routing rules are plain functions, so neither job needs the
# Electron binary or a display. The window's own behaviour -- child windows,
# downloads, single instance -- is Playwright-driven and needs a display, so it
# runs in the validation lane (docs/validation-lane.md), not here.

.cache-npm-electron: &cache-npm-electron
  cache:
    key:
      prefix: npm-electron
      files:
        - electron/package-lock.json
    paths:
      - electron/node_modules/

electron:typecheck:
  stage: lint
  image: node:22-slim
  <<: *cache-npm-electron
  variables:
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  script:
    - cd electron
    - npm ci --prefer-offline
    - npm run typecheck

# Required job — must NOT set allow_failure.
electron:test:
  stage: test
  image: node:22-slim
  <<: *cache-npm-electron
  variables:
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  script:
    - cd electron
    - npm ci --prefer-offline
    - npm test

# ─── UI ─────────────────────────────────────────────────────────────────────

ui:lint:
  stage: lint
  image: node:22-slim
  <<: *cache-npm-ui
  script:
    - cd ui
    - npm ci --prefer-offline
    - npm run lint

ui:typecheck:
  stage: lint
  image: node:22-slim
  <<: *cache-npm-ui
  script:
    - cd ui
    - npm ci --prefer-offline
    - npx tsc --noEmit

# Required job — must NOT set allow_failure.
# Hermetic: jsdom only. No backend, no MCP server, no model, no database,
# no credentials. See openspec/specs/testing-ci "Hermetic UI test lane".
ui:test:
  stage: test
  image: node:22-slim
  <<: *cache-npm-ui
  script:
    - cd ui
    - npm ci --prefer-offline
    - npm run test

# Required job — must NOT set allow_failure.
# Hermetic: starts only the Next server. Every /api/** call is answered inside
# the page from e2e-hermetic/fixtures.ts, and a route tripwire fails the run if
# one escapes. No Python backend, no MCP server, no model, no database, no
# seeded project, no credentials.
#
# The image tag MUST match the @playwright/test version pinned in
# ui/package.json, or the bundled browsers will not match the client.
ui:browser:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  <<: *cache-npm-ui
  script:
    - cd ui
    - npm ci --prefer-offline
    - npm run test:e2e:hermetic
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: ui/playwright-report.xml
    paths:
      - ui/test-results/

# ─── Nightly validation lane (Milestone D) ──────────────────────────────────
#
# Schedule this pipeline in GitLab (CI/CD → Schedules) and attach secrets only
# to the schedule. Point VISTA_LIVE_BASE_URL at a standing stack with dry-run
# HPC + a real model. See docs/validation-lane.md.

.nightly-rules: &nightly-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $VISTA_RUN_VALIDATION == "1"'
    - when: never

nightly:validation:
  stage: nightly
  <<: [*python-image, *cache-uv-backend, *nightly-rules]
  allow_failure: true
  variables:
    VISTA_RUN_LIVE: "1"
    # Override in schedule variables: VISTA_BACKEND_MODEL, provider keys,
    # VISTA_LIVE_BASE_URL, VISTA_RUN_FAULT_CHECKS, VISTA_RUN_PLAYWRIGHT
  script:
    - ./scripts/nightly-validation.sh

nightly:playwright:
  stage: nightly
  image: mcr.microsoft.com/playwright:v1.51.0-jammy
  <<: *cache-npm-ui
  allow_failure: true
  # Separate optional job so UI smoke can run without the Python validation
  # stack when only PLAYWRIGHT_BASE_URL is configured.
  # Intentionally NOT a required MR job (no merge_request_event rules).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $VISTA_RUN_PLAYWRIGHT == "1"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $VISTA_RUN_VALIDATION == "1" && $VISTA_RUN_PLAYWRIGHT == "1"'
    - when: never
  script:
    - cd ui
    - npm ci --prefer-offline
    - npx playwright test -c playwright.config.ts
