<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Image Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .container {
            max-width: 100%;
            text-align: center;
        }
    </style>
  </head>
  <body>
    <div class="container">
        <div id="loading" class="loading">Loading image...</div>
        <img id="image" style="display: none;" alt="Displayed image">
        <div id="error" class="error" style="display: none;"></div>
    </div>
    <script type="module" src="/src/image-viewer.ts"></script>
  </body>
</html>
