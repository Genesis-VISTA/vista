# The toolkit's self-test: one project, one question, one figure.
# Hand-written and public-safe (no real user, project or results).
video: selftest
pace: { typing: 1.0, stream_wps: 40, tool_min_s: 1.0 }
steps:
  - card: intro
  - goto: /projects
  - caption: [1, "Open a project", "A project scopes the agent: prompt, skills, tools"]
  - click: { role: button, name: Open, within: { css: .project-card, text: demo } }
  - caption: [2, "Ask a question", "The agent runs code in its sandbox"]
  - type: { placeholder: "Ask a question", text: "plot a damped sine wave" }
  - click: { role: button, name: "/^(Start chat|Send)$/" }
  - run:
      - tool: run_bash
        args: { command: "python plot.py --damping 0.3 --out /mnt/data/outputs/wave.svg" }
        result: "Wrote /mnt/data/outputs/wave.svg"
      - tool: display_file
        args: { path: /mnt/data/outputs/wave.svg }
        result: !asset wave.svg
      - answer: |
          Here is the damped sine wave, y = e^(-0.3t) sin(2πt), over 0–10 s.
          The envelope halves roughly every 2.3 s.
  - camera: { zoom: latest, scale: 1.3 }
  - wait: run
  - pause: 1.2
  - camera: off
  - caption: off
  - card: outro
