<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Frame</title>
<!--
  The window a recording is framed in (design D8), rendered at 1920×1080 in
  two modes from the same geometry (query parameters x, y, w, h, title, r):
    mode=bg    backdrop, shadowed window and its title bar "VISTA"
    mode=mask  white where the UI shows (the content area, rounded at the
               bottom), black elsewhere; assemble.mjs merges it as alpha
  Neutral on purpose: no operating system's window controls.
-->
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body.bg {
    background:
      radial-gradient(42% 55% at 22% 30%, rgba(79,179,255,.30), transparent 70%),
      radial-gradient(38% 50% at 82% 78%, rgba(255,138,61,.22), transparent 70%),
      linear-gradient(160deg, #0b2a4a, #061626 70%);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", "Helvetica Neue", sans-serif;
  }
  body.mask { background: #000; }
  .window { position: absolute; border-radius: var(--r); background: #fff; overflow: hidden;
    box-shadow: 0 40px 90px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.10); }
  .titlebar { height: var(--title); display: flex; align-items: center; justify-content: center; gap: 9px;
    background: linear-gradient(#f7f8fa, #eceef2); border-bottom: 1px solid #d9dde3;
    font-size: 15px; font-weight: 600; letter-spacing: .02em; color: #3a4350; }
  .titlebar img { width: 18px; height: 18px; border-radius: 4px; }
  .content { position: absolute; background: #fff; border-radius: 0 0 var(--r) var(--r); }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const n = (k) => Number(q.get(k));
  const [x, y, w, h, title, r] = ["x", "y", "w", "h", "title", "r"].map(n);
  document.documentElement.style.setProperty("--r", r + "px");
  document.documentElement.style.setProperty("--title", title + "px");
  if (q.get("mode") === "mask") {
    document.body.className = "mask";
    const c = document.createElement("div");
    c.className = "content";
    Object.assign(c.style, { left: x + "px", top: y + title + "px", width: w + "px", height: h + "px" });
    document.body.appendChild(c);
  } else {
    document.body.className = "bg";
    const win = document.createElement("div");
    win.className = "window";
    Object.assign(win.style, { left: x + "px", top: y + "px", width: w + "px", height: title + h + "px" });
    const bar = document.createElement("div");
    bar.className = "titlebar";
    if (q.get("icon")) {
      const img = document.createElement("img");
      img.src = q.get("icon");
      bar.appendChild(img);
    }
    bar.appendChild(document.createTextNode("VISTA"));
    win.appendChild(bar);
    document.body.appendChild(win);
  }
</script>
</body>
</html>
