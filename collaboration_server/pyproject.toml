[project]
name = "vista-collaboration-server"
version = "0.1.0"
requires-python = "~=3.14.3"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.27",
    "sqlmodel>=0.0.38",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20.0",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27",
    "anyio>=4.13.0",
]

[project.scripts]
vista-collaboration-server = "vista_collaboration_server.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "only-managed"

[tool.ruff.lint]
# PLW1514 (open/read_text/write_text without encoding=) is a preview rule. Preview
# also widens the default rule set, so the stable defaults are pinned here and
# only explicitly selected preview rules turn on.
preview = true
explicit-preview-rules = true
select = ["E4", "E7", "E9", "F", "PLW1514"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.14"

[tool.pytest.ini_options]
markers = [
    "unit: pure / hermetic unit tests",
    "integration: multi-module hermetic tests (fakes OK)",
    "live: needs configured model or external live services (opt-in)",
    "sandbox: needs microsandbox / Docker daemon",
    "hpc: needs real cluster credentials",
]
filterwarnings = [
    # With PYTHONWARNDEFAULTENCODING=1 (CI sets it), text I/O that relies on the locale's
    # encoding fails: Windows would read and write it as cp1252.
    "error::EncodingWarning",
]
