[project]
name = "vista-mcp-server"
version = "0.1.0"
requires-python = "~=3.14.3"
dependencies = [
    "amscrot-py @ git+https://gitlab.com/amsc2/infrastructure-and-services/infrastructure-services/resource-orchestration/amsc-isro-toolkit.git",
    "asyncssh>=2.14",
    "chromadb>=0.5.0",
    "fastmcp>=3.1.1",
    "globus-sdk>=3.40",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pydantic-settings>=2.0",
    "sentence-transformers>=3.0",
    "tenacity>=9.1.4",
    "cachetools>=7.0.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vista-mcp-server = "vista_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
artifacts = [
  "*.html",
  "agenthpc/*.yaml",
]

[tool.uv]
python-preference = "only-managed"
