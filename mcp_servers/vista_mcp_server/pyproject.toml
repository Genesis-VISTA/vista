[project]
name = "vista-mcp-server"
version = "0.1.0"
requires-python = "~=3.14.3"
dependencies = [
    "asyncssh>=2.14",
    "chromadb>=0.5.0",
    "fastmcp>=3.1.1",
    "globus-sdk>=3.40",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pydantic-settings>=2.0",
    "sentence-transformers>=3.0",
    "tenacity>=9.1.4",
    "cachetools>=7.0.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Private AmSC IRI SDK (git). Required for live HPC submit; hermetic CI/tests
# use FakeIriClient / dry-run and install without this extra.
hpc = [
    "amscrot-py @ git+https://gitlab.com/amsc2/infrastructure-and-services/infrastructure-services/resource-orchestration/amsc-isro-toolkit.git",
]

[project.scripts]
vista-mcp-server = "vista_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
artifacts = [
  "*.html",
  "agenthpc/*.yaml",
]

[tool.uv]
python-preference = "only-managed"
# amscrot-py (the hpc extra) requires every one of its providers' libraries, but
# VISTA uses only its IRI job client. Manually exclude these heavy-weight deps
# that unnecessarily complicate the build with paths too long for Windows and
# requiring C++ toolchains to build the wheel.
override-dependencies = [
    "ansible; sys_platform == 'never'",
    "fabrictestbed-extensions; sys_platform == 'never'",
]

[tool.pytest.ini_options]
markers = [
    "unit: pure / hermetic unit tests",
    "integration: multi-module hermetic tests (fakes OK)",
    "live: needs configured model or external live services (opt-in)",
    "sandbox: needs microsandbox / Docker daemon",
    "hpc: needs real cluster credentials",
]
filterwarnings = [
    # With PYTHONWARNDEFAULTENCODING=1 (CI sets it), text I/O that relies on the locale's
    # encoding fails: Windows would read and write it as cp1252. `regex` probes the locale
    # when imported, which is not ours to fix; nor is matplotlib writing its font cache.
    "error::EncodingWarning",
    "ignore::EncodingWarning:regex._main",
    "ignore::EncodingWarning:matplotlib.font_manager",
]
