[project]
name = "dev-mcp-server"
version = "0.1.0"
requires-python = "~=3.14.3"
dependencies = [
    "fastmcp>=3.1.1",
    "pydantic-settings>=2.0",
    "microsandbox==0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dev-mcp-server = "dev_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = [
  "docker/*",
]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
markers = [
    "unit: pure / hermetic unit tests",
    "integration: multi-module hermetic tests (fakes OK)",
    "live: needs configured model or external live services (opt-in)",
    "sandbox: needs microsandbox / Docker daemon",
    "hpc: needs real cluster credentials",
]
filterwarnings = [
    # With PYTHONWARNDEFAULTENCODING=1 (CI sets it), text I/O that relies on the locale's
    # encoding fails: Windows would read and write it as cp1252. `regex` probes the locale
    # when imported, which is not ours to fix.
    "error::EncodingWarning",
    "ignore::EncodingWarning:regex._main",
]
