[project]
name = "dev-mcp-server"
version = "0.1.0"
requires-python = "~=3.14.3"
dependencies = [
    "fastmcp>=3.1.1",
    "pydantic-settings>=2.0",
    "python-magic>=0.4.27",
    "microsandbox>=0.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dev-mcp-server = "dev_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = [
  "docker/*",
]
