[project]
name = "vista"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==2.14.4",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
]

[project.scripts]
vista = "vista.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = [
  "*.html",
]
