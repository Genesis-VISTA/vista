# SciAgentBench substrate: local PyPI mirror (B4.3 typo-squat imports).
#
# A local index lets the B4.3 typo-squat templates resolve (or fail to
# resolve) package names -- mdanalysys / scypi / pymatgen3 / h5py3 -- in
# a controlled environment, instead of reaching the public PyPI. We use
# pypiserver, a single-process WSGI index that serves whatever wheels /
# sdists are dropped into ./packages. devpi is a heavier alternative
# with the same role (a caching/private index); pypiserver is chosen
# here for a one-container boot and a trivial smoke test.
#
# To stage a benign or a deliberately-squatted package for a template,
# drop its built artifact into ./packages and restart.
services:
  sciagentbench-pypi-mirror:
    image: pypiserver/pypiserver:latest
    container_name: sciagentbench-pypi-mirror
    # -P . -a . : no auth required for this throwaway local mirror.
    command: ["run", "-P", ".", "-a", ".", "/data/packages"]
    ports:
      - "38080:8080"
    healthcheck:
      # The simple index root returns 200 once the server is up.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./packages:/data/packages
