[project]
name = "vista-mcp-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.14",
    "chromadb>=0.5.0",
    "fastmcp>=3.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pydantic-settings>=2.0",
    "python-magic>=0.4.27",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vista-mcp-server = "vista_mcp_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = [
  "*.html",
  "docker/*",
]
