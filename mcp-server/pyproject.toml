[project]
name = "vista-mcp-server"
version = "0.1.0"
requires-python = "==3.14.3"
dependencies = [
    "asyncssh>=2.14",
    "chromadb>=0.5.0",
    "fastmcp>=3.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pydantic-settings>=2.0",
    "python-magic>=0.4.27",
    "sentence-transformers>=3.0",
    "tenacity>=9.1.4",
    "cachetools>=7.0.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # Required by `build_rag.py` (which lives at the repo root and is
    # imported by `scripts/index_publications.py`). The Knowledge Bases
    # page spawns the indexer via `uv run --directory mcp-server`, which
    # uses this project's environment to resolve imports — so the deps
    # `build_rag.py` needs must be declared here too.
    #
    # PyMuPDF is the package; `import fitz` is its (still-supported)
    # legacy module name. Do NOT install the unrelated `fitz` package
    # from PyPI (it's an abandoned 2017 release that shadows PyMuPDF's
    # legacy name — see https://pymupdf.readthedocs.io/en/latest/installation.html).
    "pymupdf>=1.26",
    # Azure OpenAI client for citation extraction.
    # Need >=1.69 for the `reasoning_effort` kwarg (used to bound
    # internal chain-of-thought on GPT-5 family + o-series models —
    # otherwise the model can burn the entire token budget on hidden
    # reasoning and return an empty string).
    "openai>=1.69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vista-mcp-server = "vista_mcp_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = [
  "*.html",
  "docker/*",
  "agenthpc/*.yaml",
]
