services:
  backend:
    container_name: "vista-backend"
    pull_policy: "build"
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      # DooD: share the host Docker daemon socket so DockerSandbox can spawn containers
      - /var/run/docker.sock:/var/run/docker.sock
      - vista-data:/data
    environment:
      - DATA_DIR=/data
      - 'VISTA_MCP_ALLOWED_URIS=["file:///mnt/user-data/.*", "http://.*", "https://.*"]'
      - 'VISTA_MCP_URI_MAP={"file:///mnt/user-data/": "http://localhost:8000/download/"}'
    env_file:
      - path: .env
        required: false
    restart: always

  frontend:
    container_name: "vista-frontend"
    pull_policy: "build"
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Must be a URL reachable from the user's browser, not the Docker network name
        BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    restart: always

volumes:
  vista-data: {}
