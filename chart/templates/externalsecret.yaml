{{- if .Values.appSecrets.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vista-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vista.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ include "vista.secretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.appSecrets.externalSecret.secretsManagerPath | quote }}
{{- end }}
{{- if .Values.oidc.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vista-oidc-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vista.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ include "vista.oidcSecretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        oidc-config: |
          client_id: "{{ `{{ .clientId }}` }}"
          client_secret: "{{ `{{ .clientSecret }}` }}"
          discovery: {{ .Values.oidc.discovery | quote }}
          scope: {{ .Values.oidc.scope | quote }}
          token_endpoint_auth_method: client_secret_basic
          timeout: 5000
          ssl_verify: false
          keepalive: true
          session_storage: redis
          session_redis_host: "{{ `{{ .redisHost }}` }}"
          session_redis_port: {{ .Values.oidc.redis.port }}
          session_redis_prefix: {{ .Values.oidc.redis.prefix | quote }}
          session_cookie_name: {{ .Values.oidc.sessionCookieName | quote }}
          session_cookie_domain: {{ .Values.oidc.sessionCookieDomain | quote }}
          session_cookie_samesite: Lax
          session_cookie_secure: true
          session_cookie_httponly: true
          session_secret: "{{ `{{ .sessionSecret }}` }}"
          redirect_uri: {{ printf "https://%s/auth" .Values.host | quote }}
          logout_path: /auth/logout
          logout_redirect_uri: {{ printf "https://auth.globus.org/v2/web/logout?redirect_uri=https://%s" .Values.host | quote }}
  dataFrom:
    - extract:
        key: {{ .Values.oidc.externalSecret.secretsManagerPath | quote }}
{{- end }}
