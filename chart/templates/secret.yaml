{{- if .Values.appSecrets.create }}
# Dev-bootstrap secret. Pass real values via ArgoCD helm.values — never commit them.
# In production, disable this and use appSecrets.externalSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vista.secretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vista.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.appSecrets.openaiApiKey | quote }}
  VISTA_BACKEND_ENCRYPTION_KEY: {{ .Values.appSecrets.encryptionKey | quote }}
  HF_TOKEN: {{ .Values.appSecrets.hfToken | quote }}
  GLOBUS_SETUP_KEY: {{ .Values.appSecrets.globusSetupKey | quote }}
  VISTA_MCP_ODO_GLOBUS_REFRESH_TOKEN: {{ .Values.appSecrets.globusOdoRefreshToken | quote }}
  VISTA_MCP_FRONTIER_GLOBUS_REFRESH_TOKEN: {{ .Values.appSecrets.globusFrontierRefreshToken | quote }}
  VISTA_MCP_OMD_API_KEY: {{ .Values.appSecrets.omdApiKey | quote }}
{{- end }}
